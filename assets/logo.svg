<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appleMusicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="45%" stop-color="#fa233b" />
      <stop offset="100%" stop-color="#d61b5f" />
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#fa233b" flood-opacity="0.4" />
    </filter>
    <filter id="noteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#appleMusicGrad)" filter="url(#iconShadow)"/>

  <!-- Subtle Glass Inner Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4"/>

  <!-- Apple Music Double Musical Note -->
  <g filter="url(#noteGlow)">
    <!-- Right Stem -->
    <path d="M344 140 v 192 c 0 32 -26 58 -58 58 c -32 0 -58 -26 -58 -58 c 0 -32 26 -58 58 -58 c 12 0 23 4 32 10 V 176 L 194 204 v 164 c 0 32 -26 58 -58 58 c -32 0 -58 -26 -58 -58 c 0 -32 26 -58 58 -58 c 12 0 23 4 32 10 V 166 c 0 -18 12 -33 30 -37 l 120 -28 c 14 -3 26 7 26 21 z" fill="#ffffff" />
  </g>
</svg>
